name: Keep Supabase alive
on:
  schedule:
    - cron: '30 2 * * *'   # every day at 08:00 IST
  workflow_dispatch:       # also lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive ping
        run: |
          curl -fsS -X POST "https://emikqjnqnrgqzpujdwzp.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_1o6T2WrmhKp52DySiIjq0g_SLY-ri9Z" \
            -H "Content-Type: application/json" \
            -d '{}'
